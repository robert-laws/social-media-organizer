<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Masthead</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C1A15'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-style='italic' fill='%23FAF8F3' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Schibsted+Grotesk:wght@400..700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #faf8f3;
      color: #1c1a15;
      font-family: 'Schibsted Grotesk', 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .wrap {
      max-width: 680px;
      width: 100%;
      text-align: center;
      animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .kicker {
      font-family: 'Spline Sans Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #b4500f;
      margin-bottom: 10px;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 560;
      font-size: clamp(34px, 6vw, 52px);
      letter-spacing: -0.015em;
      line-height: 1.08;
      margin: 0 0 12px;
    }
    h1 em { font-style: italic; font-weight: 500; }
    p.sub {
      color: #8a857a;
      font-size: 15px;
      max-width: 46ch;
      margin: 0 auto 26px;
      line-height: 1.55;
    }
    .frame {
      background: #fffefb;
      border: 1px solid #e5e0d3;
      border-radius: 12px;
      box-shadow: 0 2px 4px rgba(28,26,21,0.07), 0 12px 32px rgba(28,26,21,0.09);
      padding: 10px;
      margin-bottom: 28px;
    }
    .frame img {
      display: block;
      width: 100%;
      border-radius: 7px;
    }
    .frame figcaption {
      font-family: 'Spline Sans Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: #8a857a;
      padding: 9px 4px 4px;
    }
    a.btn {
      display: inline-block;
      background: #1c1a15;
      color: #faf8f3;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 11px 22px;
      border-radius: 7px;
      transition: background 0.12s, transform 0.12s;
    }
    a.btn:hover { background: #2e2b24; transform: translateY(-1px); }
    .mark {
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-weight: 640;
      font-size: 19px;
      margin-top: 34px;
      color: #57534a;
    }
    .mark span { color: #b4500f; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="kicker">Error 404 · Page not found</div>
    <h1>Nobody's at <em>this</em> desk.</h1>
    <p class="sub">The page you're looking for was never drafted, got rescheduled, or simply doesn't exist. The studio, however, is right where you left it.</p>
    <figure class="frame" style="margin:0 0 28px;">
      <img src="/social-media-organizer/images/404-page.jpg" alt="An empty, all-white office with a blank computer screen" />
      <figcaption>fig. 404 — the empty office</figcaption>
    </figure>
    <a class="btn" href="/social-media-organizer/">← Back to the studio</a>
    <div class="mark">Masthead<span>.</span></div>
  </main>
</body>
</html>
